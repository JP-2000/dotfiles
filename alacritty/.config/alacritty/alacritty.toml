[general]
import = [
    "~/.config/alacritty/themes/everforest-dark-soft.toml"
]

[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 213, lines = 59 }
padding = { x = 0, y = 0 }
dynamic_padding = false
resize_increments = true
opacity = 1.0

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"
