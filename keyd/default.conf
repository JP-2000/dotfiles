[ids]
*


# ============================================================
# MAIN LAYOUT
# ============================================================

[main]

# Tap Esc normally.
# Hold Esc to choose a layer.
esc = overload(layer_select, esc)

# Tap Caps Lock = Esc.
# Hold Caps Lock = Ctrl.
capslock = overload(control, esc)


# ============================================================
# LAYER SELECTOR
# ============================================================
#
# Esc + n -> NAV
# Esc + u -> UTILITY
# Esc + m -> MAIN
#

[layer_select]

n = setlayout(nav)
u = setlayout(utility)
m = setlayout(main)


# ============================================================
# NAV LAYOUT
# ============================================================

[nav:layout]


# ------------------------------------------------------------
# Vim navigation
# ------------------------------------------------------------

h = left
j = down
k = up
l = right


# ------------------------------------------------------------
# Page navigation
# ------------------------------------------------------------

u = pageup
o = pagedown


# ------------------------------------------------------------
# Function keys
# ------------------------------------------------------------

1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10

minus = f11
backslash = f12


# ------------------------------------------------------------
# Modifier layers
# ------------------------------------------------------------
#
# W + key -> Super + Shift + key
# S + key -> Ctrl + Alt + key
#

w = layer(cmdshift)
s = layer(ctrlalt)


# ============================================================
# NAV + SHIFT
# ============================================================
#
# Shift + W -> move WINDOW between workspaces
# Shift + S -> reorder WORKSPACES
#

[nav+shift]

w = layer(move_window)
s = layer(reorder_workspace)


# ============================================================
# SUPER + SHIFT
# ============================================================

[cmdshift:M-S]


# ============================================================
# CTRL + ALT
# ============================================================

[ctrlalt:C-A]


# ============================================================
# MOVE CURRENT WINDOW BETWEEN WORKSPACES
# ============================================================
#
# Shift + W + h -> move window one workspace left
# Shift + W + l -> move window one workspace right
#
# GNOME:
#   Super + Shift + PageUp
#   Super + Shift + PageDown
#

[move_window:M-S]

h = pageup
l = pagedown


# ============================================================
# REORDER WORKSPACES
# ============================================================
#
# Shift + S + h -> reorder workspace left
# Shift + S + l -> reorder workspace right
#
# F13/F14 are used as spare keys here.
# They can later be connected to GNOME commands/shortcuts
# that reorder the current workspace.
#

[reorder_workspace]

h = f13
l = f14


# ============================================================
# UTILITY LAYOUT
# ============================================================

[utility:layout]


# ------------------------------------------------------------
# Volume
# ------------------------------------------------------------

v = volumeup


# ------------------------------------------------------------
# Brightness / Bluetooth
# ------------------------------------------------------------

b = overload(bluetooth_util, brightnessup)


# ------------------------------------------------------------
# Media
# ------------------------------------------------------------

n = nextsong
p = playpause
m = mute


# ------------------------------------------------------------
# Wi-Fi
# ------------------------------------------------------------

w = wlan


# ============================================================
# UTILITY + SHIFT
# ============================================================

[utility+shift]

v = volumedown
b = brightnessdown
n = previoussong


# ============================================================
# BLUETOOTH
# ============================================================

[bluetooth_util]

t = bluetooth
